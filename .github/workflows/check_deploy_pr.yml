name: Gatsby Check PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gatsby-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use repository Node version
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Check editorial metadata and changed-post warnings
        shell: bash
        run: |
          changed_mdx="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- 'src/mdx/*.mdx' | paste -sd, -)"
          npm run editorial:check -- --soft="$changed_mdx"

      - name: Install locked dependencies
        run: npm ci

      - name: Build Gatsby site
        run: npm run build

      - name: Confirm tracked files are unchanged
        run: git diff --exit-code
